name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 検査の中身は scripts/check.sh にある（手元でも同じコマンドで再現できるようにするため）。
# このファイルはマトリクスの定義だけを持つ。
jobs:
  check:
    name: ${{ matrix.mode }} (${{ matrix.cc }}, -std=${{ matrix.std }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # GCC / Clang のみ（MSVC は対象外。docs/adr/0007-msvc-out-of-scope.md）
        cc: [gcc, clang]
        std: [c99, c11, c17]
        # default : examples / tests（ASan）/ spec
        # sanitize: -O2 + ASan + UBSan。最適化時の挙動（不正 tag の扱い等）を確かめる
        # strict  : 利用側が付けがちな厳格警告（-Wswitch-default, -Wconversion 等）でも警告が出ないこと
        mode: [default, sanitize, strict]

    steps:
      - uses: actions/checkout@v4

      - name: Run checks
        env:
          CC: ${{ matrix.cc }}
          STD: ${{ matrix.std }}
          MODE: ${{ matrix.mode }}
        run: bash scripts/check.sh
