name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 検査の中身は scripts/check.sh にある（手元でも同じコマンドで再現できるようにするため）。
# このファイルはマトリクスの定義だけを持つ。
jobs:
  check:
    name: ${{ matrix.mode }} (${{ matrix.cc }}, -std=${{ matrix.std }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # GCC / Clang のみ（MSVC は対象外。docs/adr/0007-msvc-out-of-scope.md）
        cc: [gcc, clang]
        std: [c99, c11, c17]
        # default : examples / tests（ASan）/ spec
        # sanitize: -O2 + ASan + UBSan。最適化時の挙動（不正 tag の扱い等）を確かめる
        # strict  : 利用側が付けがちな厳格警告（-Wswitch-default, -Wconversion 等）でも警告が出ないこと。gcc では -fanalyzer も
        mode: [default, sanitize, strict]

    steps:
      - uses: actions/checkout@v4

      - name: Run checks
        env:
          CC: ${{ matrix.cc }}
          STD: ${{ matrix.std }}
          MODE: ${{ matrix.mode }}
        run: bash scripts/check.sh

  # 組込み向けクロスコンパイラ（Cortex-M4, newlib）でビルドし、qemu-arm（セミホスティング）で実行する。
  # -fshort-enums（AAPCS 既定）や int32_t = long といった、ホストと異なる前提での警告・誤動作を拾う。
  cross-arm:
    name: cross (arm-none-eabi-gcc, -std=${{ matrix.std }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        std: [c99, c11, c17]
    steps:
      - uses: actions/checkout@v4
      - name: Install arm-none-eabi-gcc and qemu-user
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi qemu-user
      - name: Run checks
        env:
          CC: arm-none-eabi-gcc
          CROSS_CFLAGS: -mcpu=cortex-m4 -mthumb --specs=rdimon.specs
          CROSS_RUN: qemu-arm -cpu cortex-m4
          STD: ${{ matrix.std }}
          MODE: cross
        run: bash scripts/check.sh
